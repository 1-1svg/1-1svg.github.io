<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>20-Sekunden-Klickspiel</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;text-align:center;background:#fff;color:#000;margin:0;padding:30px 15px}
#info{font-size:22px;margin:15px}
#start{font-size:18px;padding:12px 24px;border:1px solid #000;border-radius:10px;background:#fff;color:#000}
#spielfeld{width:min(90vw,500px);height:300px;margin:25px auto;background:#fff;border:2px solid #ccc;border-radius:15px;position:relative}
#punkt{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:70px;height:70px;border-radius:50%;padding:0;background:#000;color:#fff;font-size:25px;border:0;touch-action:manipulation}
#countdown,#ende{display:none;position:fixed;inset:0;background:#fff;color:#000;align-items:center;justify-content:center;z-index:20}
#countdown{font-size:110px;font-weight:bold}
#ende{flex-direction:column;z-index:30}
#punkteFinal{font-size:48px;font-weight:bold;margin-bottom:30px}
#wiederholen{display:none;font-size:46px;background:#fff;color:#000;border:0;padding:10px;line-height:1}
</style>
</head>
<body>
<h1>20-Sekunden-Klickspiel</h1>
<div id="info">Zeit: <span id="zeit">20,0</span> s | Klicks: <span id="klicks">0</span></div>
<button id="start">Start</button>
<div id="spielfeld"><button id="punkt" disabled>●</button></div>
<div id="countdown">3</div>
<div id="ende"><div id="punkteFinal">0</div><button id="wiederholen" aria-label="Wiederholen">↻</button></div>
<script>
let klicks=0,ende=0,timer=null,countTimer=null,aktiv=false;
const start=document.getElementById("start"),punkt=document.getElementById("punkt"),zeit=document.getElementById("zeit"),anzeige=document.getElementById("klicks"),countdown=document.getElementById("countdown"),endeScreen=document.getElementById("ende"),punkteFinal=document.getElementById("punkteFinal"),wiederholen=document.getElementById("wiederholen");
function starten(){
 clearInterval(timer);clearInterval(countTimer);
 klicks=0;anzeige.textContent="0";zeit.textContent="20,0";aktiv=false;punkt.disabled=true;start.disabled=true;
 endeScreen.style.display="none";wiederholen.style.display="none";countdown.style.display="flex";
 let n=3;countdown.textContent=n;
 countTimer=setInterval(()=>{
   n--;
   if(n>0){countdown.textContent=n;}
   else{
     clearInterval(countTimer);countdown.style.display="none";aktiv=true;punkt.disabled=false;
     ende=performance.now()+20000;
     timer=setInterval(()=>{
       const rest=Math.max(0,ende-performance.now());
       zeit.textContent=(rest/1000).toFixed(1).replace(".",",")+" s";
       if(rest<=0){
         clearInterval(timer);aktiv=false;punkt.disabled=true;start.disabled=false;
         punkteFinal.textContent=klicks;wiederholen.style.display="none";endeScreen.style.display="flex";setTimeout(()=>{wiederholen.style.display="block";},2000);
       }
     },50);
   }
 },1000);
}
start.onclick=starten;
wiederholen.onclick=()=>{endeScreen.style.display="none";wiederholen.style.display="none";start.disabled=false;};
punkt.onclick=()=>{if(aktiv){klicks++;anzeige.textContent=klicks}};
</script>
</body>
</html>
